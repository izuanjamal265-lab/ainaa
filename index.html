<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>For You ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="particles"></div>

  <main id="app">
    <section id="lock" class="screen lock-screen">
      <div class="lock-card">
        <div class="name-script" id="openingTitle"></div>
        <div class="name-script second" id="openingSubtitleTitle"></div>
        <p id="openingSubtitle"></p>

        <div id="pinDots" class="pin-dots" aria-label="Password progress"></div>

        <div id="pinError" class="pin-error" aria-live="polite"></div>

        <div class="keypad" id="keypad">
          <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
          <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
          <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
          <button data-key="clear">C</button><button data-key="0">0</button><button data-key="back">⌫</button>
        </div>

        <div class="hint" id="passwordHint"></div>
      </div>
    </section>

    <section class="screen hero hidden" id="birthday">
      <p class="eyebrow" id="birthdaySmall"></p>
      <h1 id="birthdayTitle"></h1>
      <h2 id="birthdayName"></h2>
      <p class="body-copy" id="birthdayText"></p>
      <button class="continue" data-next="bouquet">Continue ♡</button>
    </section>

    <section class="screen hidden" id="bouquet">
      <p class="eyebrow" id="bouquetSmall"></p>
      <h1 id="bouquetTitle"></h1>
      <p class="body-copy" id="bouquetText"></p>
      <div class="bouquet" id="bouquetArt" aria-label="Bouquet">
        <span class="flower f1">🌷</span><span class="flower f2">🌸</span><span class="flower f3">🌷</span>
        <span class="flower f4">🌼</span><span class="flower f5">🌸</span>
        <span class="stem s1"></span><span class="stem s2"></span><span class="stem s3"></span>
      </div>
      <p class="bouquet-message" id="bouquetMessage"></p>
      <button class="continue" data-next="memories">Keep going ♡</button>
    </section>

    <section class="screen hidden" id="memories">
      <p class="eyebrow" id="memoriesSmall"></p>
      <h1 id="memoriesTitle"></h1>
      <div class="polaroid-wrap">
        <button class="arrow" id="prevPhoto">‹</button>
        <div class="polaroid">
          <img id="memoryImage" alt="Memory">
          <p id="memoryCaption"></p>
        </div>
        <button class="arrow" id="nextPhoto">›</button>
      </div>
      <div class="counter" id="memoryCounter"></div>
      <button class="continue" data-next="playlist">Next ♡</button>
    </section>

    <section class="screen hidden" id="playlist">
      <p class="eyebrow" id="playlistSmall"></p>
      <h1 id="playlistTitle"></h1>
      <div class="player">
        <div class="disc">♫</div>
        <div>
          <strong id="songTitle">Choose a song</strong>
          <small id="songArtist">♡</small>
        </div>
        <button id="playBtn">▶</button>
      </div>
      <div class="song-list" id="songList"></div>
      <audio id="audio"></audio>
      <button class="continue" data-next="letter">A letter for you ♡</button>
    </section>

    <section class="screen hidden letter-screen" id="letter">
      <p class="eyebrow" id="letterSmall"></p>
      <h1 id="letterTitle"></h1>
      <div class="letter-paper">
        <p id="letterText"></p>
      </div>
      <button class="continue" data-next="final">One last thing ♡</button>
    </section>

    <section class="screen hidden final-screen" id="final">
      <p class="eyebrow" id="finalSmall"></p>
      <h1 id="finalTitle"></h1>
      <p class="body-copy" id="finalText"></p>
      <div class="signature" id="finalSignature"></div>
      <div class="heart-big">♥</div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
